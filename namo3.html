<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }
        body{
            background:#f5f5f5;
            overflow-x:hidden;
        }

        .box{
            position:fixed;
            width:240px;
            height:240px;
            display:none;
            pointer-events:none;
            z-index:1000;
            transition:left .08s linear,top .08s linear;
        }

        nav{
            display:flex;
            justify-content:space-between;
            padding:30px 50px;
            font-size:14px;
            letter-spacing:3px;
            position:fixed;
            width:100%;
            top:0;
            left:0;
        }

        .hero{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            text-align:center;
        }

        .small{
            font-size:14px;
            letter-spacing:5px;
            margin-bottom:40px;
        }

        .hero h1{
            font-size:95px;
            font-weight:900;
            line-height:105px;
            width:80%;
        }

        .word{
            border-bottom:4px solid black;
            cursor:pointer;
        }

        .box img{
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:10px;
            box-shadow:0 15px 30px rgba(0,0,0,.3);
        }

        .animate{
            animation:up .45s;
        }

        @keyframes up{
            0%{
                opacity:0;
                transform:translateY(80px) scale(.9);
            }
            100%{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }
    </style>

</head>

<body>

    <nav>
        <div>STUDIO NAMMA</div>
        <div>DARK MODE</div>
        <div>MENU</div>
        <div>LET'S TALK!</div>
    </nav>

    <div class="hero">
        <p class="small">
            CREATIVE STUDIO BUILDING PREMIUM BRANDS
        </p>
        <h1>
            IT'S NEVER "JUST A WEBSITE".<br>
            EVERY
            <span class="word detail">
                DETAIL
            </span>
            MATTERS.<br>
            WE CRAFT DIGITAL EXPERIENCES.<br>
            YOUR DESIGN. OUR OBSESSION.<br>
            YOUR BRAND.
            <span class="word play">
                PLAYGROUND
            </span>
        </h1>
    </div>

    <div class="box">
        <img src="1.png" id="photo">
    </div>

    <script>
        let detail=document.querySelector(".detail");
        let play=document.querySelector(".play");

        let box=document.querySelector(".box");
        let photo=document.querySelector("#photo");

        let detailImg=[
            "1.jpeg",
            "2.jpeg",
            "3.jpeg",
            "4.jpeg"
        ];

        let playImg=[
            "5.jpeg",
            "6.jpeg",
            "7.jpeg",
            "8.jpeg"
        ];

        let i=0;
        let timer;

        document.addEventListener("mousemove",(e)=>{
            box.style.left=e.pageX+20+"px";
            box.style.top=e.pageY-250+"px";
        });

        function start(arr){
            box.style.display="block";
            i=0;
            photo.src=arr[i];
            photo.classList.add("animate");
            clearInterval(timer);
            timer=setInterval(()=>{
                photo.classList.remove("animate");
                i++;
                if(i>=arr.length){
                    i=0;
                }
                photo.src=arr[i];
                box.style.width="320px";
                box.style.height="220px";
                photo.style.transform="rotate(-6deg)";
                if(i%2==0){
                    box.style.width="320px";
                    box.style.height="220px";
                    photo.style.transform="rotate(-6deg)";
                }
                else{
                    box.style.width="220px";
                    box.style.height="320px";
                    photo.style.transform="rotate(6deg)";
                }
                setTimeout(()=>{
                    photo.classList.add("animate");
                },10);
            },300);
        }

        function stop(){
            clearInterval(timer);
            box.style.display="none";
            photo.classList.remove("animate");
        }
        detail.addEventListener("mouseenter",()=>{
            start(detailImg);
        });
        detail.addEventListener("mouseleave",stop);
        play.addEventListener("mouseenter",()=>{
            start(playImg);
        });
        play.addEventListener("mouseleave",stop);
    </script>

</body>
</html>
