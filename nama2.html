<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container{
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .container iframe{
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;      /* 16:9 */
            min-width: 177.78vh;
            min-height: 100vh;
            transform: translate(-50%, -50%);
            border: 0;
            pointer-events: none;
        }

        .circle{
            width: 10px;
            height: 10px;
            background-color: blue;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe
            src="https://player.vimeo.com/video/1127104834?background=1&autoplay=1&muted=1&loop=1"
            allow="autoplay; fullscreen">
        </iframe>
    </div>
    <div class="circle"></div>
    <script>
        let circle=document.querySelector('.circle')
        document.addEventListener('mousemove', (event)=>{
            circle.style.left=(event.clientX + 20)+"px"
            circle.style.top=(event.clientY + 20)+"px"
        });
    </script>
</body>
</html>
